name: tubearchivist

services:
  tubearchivist:
    container_name: tubearchivist
    image: bbilly1/tubearchivist:v0.5.12
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /mnt/tv/youtube:/youtube
      - /mnt/data/tubearchivist/cache:/cache
    expose:
      - 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - archivist-es
      - archivist-redis
    networks:
      - default
      - traefik_proxynetwork
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tubearchivist.rule=Host(`tubearchivist.cosmos.cboxlab.com`)"
      - "traefik.http.routers.tubearchivist.entrypoints=websecure"
      - "traefik.http.routers.tubearchivist.tls=true"
      - "traefik.http.routers.tubearchivist.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tubearchivist.tls.domains[0].main=cosmos.cboxlab.com"
      - "traefik.http.routers.tubearchivist.tls.domains[0].sans=*.cosmos.cboxlab.com"
      - "traefik.http.services.tubearchivist.loadbalancer.server.port=8000"

  archivist-redis:
    container_name: archivist-redis
    image: redis:8.10.1
    restart: unless-stopped
    volumes:
      - /mnt/data/tubearchivist/redis:/data
    expose:
      - 6379
    depends_on:
      - archivist-es

  archivist-es:
    container_name: archivist-es
    image: bbilly1/tubearchivist-es:8.19.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      xpack.security.enabled: "true"
      discovery.type: single-node
      path.repo: /usr/share/elasticsearch/data/snapshot
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /mnt/data/tubearchivist/es:/usr/share/elasticsearch/data
    expose:
      - 9200

networks:
  traefik_proxynetwork:
    external: true
